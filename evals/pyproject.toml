[project]
name = "groundwork-evals"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "deepeval>=4.2.8,<5",
  "httpx>=0.28,<1",
  "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.17,<0.18"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:rerunfailures"

[tool.ruff]
line-length = 100
required-version = ">=0.17.0,<0.18.0"
target-version = "py311"
force-exclude = true
extend-exclude = ["reports", ".deepeval"]

[tool.ruff.lint]
select = [
  "E", "F",       # Syntax, undefined names, and unused code
  "I", "UP",      # Import order and modern Python
  "B", "BLE",     # Bug-prone code and broad exception handling
  "SIM", "C4",    # Needlessly complicated code and comprehensions
  "A", "ARG",     # Shadowed builtins and unused arguments
  "ANN",          # Function signatures must have type annotations
  "S",            # Common security mistakes
  "RET", "PIE",   # Return flow and redundant code
  "PT",           # Pytest practices
  "PLE", "PLW",   # Pylint correctness errors and warnings
  "PTH", "RUF",   # Pathlib and Ruff-specific checks
  "C90",          # Function complexity
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"] # Assertions and deliberately fake credentials

[tool.ruff.lint.isort]
known-first-party = ["harness", "suites"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
