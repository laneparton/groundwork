name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - run: npm ci --prefix apps/server
      - run: npm ci --prefix apps/web
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck --prefix apps/server
      - run: npm run typecheck --prefix apps/web

  unit:
    name: Unit tests and coverage (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [server, web]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci --prefix apps/${{ matrix.app }}
      # Fails below 80% lines, branches, functions, or statements.
      - run: npm run test:coverage --prefix apps/${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.app }}
          path: apps/${{ matrix.app }}/coverage/
          if-no-files-found: ignore

  mutation:
    name: Mutation tests (${{ matrix.app }})
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [server, web]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci --prefix apps/${{ matrix.app }}
      # Incremental runs reuse results for unchanged code and tests.
      - uses: actions/cache@v4
        with:
          path: apps/${{ matrix.app }}/reports/stryker-incremental.json
          key: stryker-${{ matrix.app }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            stryker-${{ matrix.app }}-${{ github.head_ref || github.ref_name }}-
            stryker-${{ matrix.app }}-main-
      # Fails below the break threshold in stryker.config.json.
      - run: npm run test:mutation --prefix apps/${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-${{ matrix.app }}
          path: apps/${{ matrix.app }}/reports/mutation/
          if-no-files-found: ignore

  integration:
    name: Cross-app integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci --prefix apps/server
      - run: npm ci --prefix apps/web
      - run: npm run test:integration --prefix apps/web

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci --prefix apps/server
      - run: npm ci --prefix apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e --prefix apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
